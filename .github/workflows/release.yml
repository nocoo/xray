name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g. v2.2.0)"
        required: true
        type: string

jobs:
  deploy:
    name: Deploy Worker
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@2857469cc5206e7a4988171a1282209617996a67
    with:
      expected-workflow-path: ".github/workflows/ci.yml"
      expected-workflow-name: "CI"
      source-run-id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || '' }}
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag || '' }}
      package-version-match: ${{ github.event_name != 'workflow_run' }}
      runtime-version: "1.3.14"
      install-policy: "blocked"
      build-command: "bun run build"
      wrangler-version: "4.130.0"
      wrangler-working-directory: "packages/worker"
      d1-migrations: true
      d1-command: "d1 migrations apply xray-db --remote --env production"
      deploy-command: deploy --env production
      environment: production
      concurrency-group: deploy-worker-production
      timeout-minutes: 15
      verify-command: |
        EXPECTED=$(jq -r .version package.json)
        HTTP=$(curl -fsS -o /tmp/live.json -w "%{http_code}" https://xray-ingest.hexly.ai/api/live || echo "000")
        ACTUAL=$(jq -r .version /tmp/live.json 2>/dev/null || echo "?")
        test "$HTTP" = "200" && test "$ACTUAL" = "$EXPECTED"
      verify-retries: 6
      verify-retry-seconds: 5
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
