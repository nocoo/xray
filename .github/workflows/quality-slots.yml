name: Quality Slots

on:
  workflow_call:
    outputs:
      tested-sha:
        description: Commit SHA verified by quality gate
        value: ${{ jobs.z1-gate.outputs.tested-sha }}

env:
  BUN_VERSION: "1.3.14"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  CI: "true"

jobs:
  s1-types:
    name: "S1: Types"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-js@98fc023423f82b010f17e0ebbc9dd580fe68736a # v2026.19
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          install-policy: trusted
      - run: bun run typecheck
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s2-lint:
    name: "S2: Lint"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-js@98fc023423f82b010f17e0ebbc9dd580fe68736a # v2026.19
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          install-policy: trusted
      - run: bun run lint
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s3-workflow:
    name: "S3: Workflow"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/lint-workflows@98fc023423f82b010f17e0ebbc9dd580fe68736a # v2026.19
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g1-secrets:
    name: "G1: Secrets"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: nocoo/base-ci/.github/actions/scan-secrets@98fc023423f82b010f17e0ebbc9dd580fe68736a # v2026.19
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g2-dependencies:
    name: "G2: Dependencies"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/scan-dependencies@98fc023423f82b010f17e0ebbc9dd580fe68736a # v2026.19
        with:
          lockfiles: "bun.lock"
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  b1-build:
    name: "B1: Build"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-js@98fc023423f82b010f17e0ebbc9dd580fe68736a # v2026.19
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          install-policy: trusted
      - run: bun run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xray-build
          path: |
            packages/shared/dist
            packages/worker/static
            packages/worker/dist
          if-no-files-found: error
          retention-days: 1
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l1-unit:
    name: "L1: Unit"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-js@98fc023423f82b010f17e0ebbc9dd580fe68736a # v2026.19
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          install-policy: trusted
      - run: bun run test:coverage && bun run test:release
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l2-runtime:
    name: "L2: Runtime"
    if: ${{ vars.ENABLE_L2_RUNTIME == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "N/A - Cloudflare Worker project, covered by L3/L4"

  l3-integration:
    name: "L3: Integration"
    needs:
      - b1-build
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-js@98fc023423f82b010f17e0ebbc9dd580fe68736a # v2026.19
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          install-policy: trusted
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xray-build
          path: packages
      - run: |
          bun run check:wrangler-version
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID -u CF_API_TOKEN bun run test:l2
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l4-e2e:
    name: "L4: E2E"
    needs:
      - b1-build
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-js@98fc023423f82b010f17e0ebbc9dd580fe68736a # v2026.19
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          install-policy: trusted
      - uses: nocoo/base-ci/.github/actions/setup-playwright@98fc023423f82b010f17e0ebbc9dd580fe68736a # v2026.19
        with:
          package-manager: bun
          browsers: chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xray-build
          path: packages
      - run: |
          bun run check:wrangler-version
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID -u CF_API_TOKEN bun scripts/test-l3.ts
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  p1-package:
    name: "P1: Package"
    if: ${{ vars.ENABLE_P1_PACKAGE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "N/A - Cloudflare Worker project, not published to npm"

  z1-gate:
    name: "Z1: Gate"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - s1-types
      - s2-lint
      - s3-workflow
      - g1-secrets
      - g2-dependencies
      - b1-build
      - l1-unit
      - l2-runtime
      - l3-integration
      - l4-e2e
      - p1-package
    outputs:
      tested-sha: ${{ steps.gate.outputs.tested-sha }}
    steps:
      - name: Verify quality slots
        id: gate
        uses: nocoo/base-ci/.github/actions/z1-gate@98fc023423f82b010f17e0ebbc9dd580fe68736a # v2026.19
        with:
          needs-json: ${{ toJSON(needs) }}
          expected-sha: ${{ github.sha }}
          required-jobs: |
            s1-types=S1: Types
            s2-lint=S2: Lint
            s3-workflow=S3: Workflow
            g1-secrets=G1: Secrets
            g2-dependencies=G2: Dependencies
            b1-build=B1: Build
            l1-unit=L1: Unit
            l3-integration=L3: Integration
            l4-e2e=L4: E2E
          skipped-jobs: |
            l2-runtime=L2: Runtime
            p1-package=P1: Package
