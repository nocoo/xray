name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      runtime-version: "1.3.14"
      install-policy: "trusted"
      coverage-path: "packages/*/coverage"
      lint-command: "bun run lint"
      typecheck-command: "bun run typecheck"
      test-command: |
        bun run test
        bun run test:coverage

  l2:
    name: L2 real-HTTP + routes
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      runtime-version: "1.3.14"
      install-policy: "trusted"
      timeout-minutes: 15
      pre-command: "bun run build:shared"
      command: "bun run test:l2"
      env-json: |-
        {
          "PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD": "1"
        }
