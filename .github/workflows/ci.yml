name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ac635753a869cb85fad1f52aae4ccbd6119f3cae # main 2026-10-22
    with:
      runtime-version: "1.3.14"
      install-policy: "trusted"
      coverage-path: "packages/*/coverage"
      lint-command: "bun run lint"
      typecheck-command: "bun run typecheck"
      test-command: |
        bun run test
        bun run test:coverage

  l2:
    name: L2 real-HTTP + routes
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ac635753a869cb85fad1f52aae4ccbd6119f3cae # main 2026-10-22
    with:
      runtime-version: "1.3.14"
      install-policy: "trusted"
      timeout-minutes: 15
      pre-command: |
        bun run check:wrangler-version
        bun run build:shared
      command: "bun run test:l2"
      env-json: |-
        {
          "PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD": "1"
        }

  l3:
    name: L3 managed Chromium + WebKit + build
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ac635753a869cb85fad1f52aae4ccbd6119f3cae # main 2026-10-22
    with:
      runtime-version: "1.3.14"
      install-policy: "trusted"
      timeout-minutes: 20
      browser: chromium
      pre-command: |
        bun run check:wrangler-version
        bun x --no-install playwright install --with-deps webkit
      command: "bun run test:l3"
      env-json: '{"CI":"true"}'
