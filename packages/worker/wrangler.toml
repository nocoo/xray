name = "xray"
main = "src/index.ts"
compatibility_date = "2026-08-08"

[assets]
directory = "./static"
binding = "ASSETS"
# Worker handles host allowlist first; browser hosts then fetch ASSETS (S23-02).
# SPA fallback only reached for browser/local hosts (ingest/unknown 404 in worker).
run_worker_first = true
not_found_handling = "single-page-application"

# Default (deploy) is production — AUTH_DEV_BYPASS must fail-closed here (S2.3).
[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "xray-db"
database_id = "af2cbf2a-da14-4fd1-ab45-0f996ef09437"
migrations_dir = "migrations"

# Local / wrangler dev — use: wrangler dev --env development
[env.development]
name = "xray-dev"
vars = { ENVIRONMENT = "development", AUTH_DEV_BYPASS = "true", ALLOWED_EMAILS = "dev@xray.local" }

[[env.development.d1_databases]]
binding = "DB"
database_name = "xray-db"
database_id = "af2cbf2a-da14-4fd1-ab45-0f996ef09437"
migrations_dir = "migrations"

[env.production]
name = "xray"
vars = { ENVIRONMENT = "production" }

[env.production.observability]
enabled = true
head_sampling_rate = 1

[[env.production.d1_databases]]
binding = "DB"
database_name = "xray-db"
database_id = "af2cbf2a-da14-4fd1-ab45-0f996ef09437"
migrations_dir = "migrations"

# Dual host (XR-01): browser Access wall vs ingest Bearer-only.
# Browser host already has external DNS → zone route.
# Ingest host is new → custom_domain creates DNS + attach.
[[env.production.routes]]
pattern = "xray.hexly.ai/*"
zone_name = "hexly.ai"

[[env.production.routes]]
pattern = "xray-ingest.hexly.ai"
custom_domain = true

# S45-04 — production ingest rate limit (replace namespace_id with CF dashboard value)
# Without this binding, production push fail-closes (429 rate_limit_unavailable).
[[env.production.ratelimits]]
name = "XRAY_INGEST_RL"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
