name = "xray"
main = "src/index.ts"
compatibility_date = "2026-08-08"

[assets]
directory = "./static"
binding = "ASSETS"
# Worker handles host allowlist first; browser hosts then fetch ASSETS (S23-02).
# SPA fallback only reached for browser/local hosts (ingest/unknown 404 in worker).
run_worker_first = true
not_found_handling = "single-page-application"

# Default (deploy) is production — AUTH_DEV_BYPASS must fail-closed here (S2.3).
[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "xray-db"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

# Local / wrangler dev — use: wrangler dev --env development
[env.development]
name = "xray-dev"
vars = { ENVIRONMENT = "development", AUTH_DEV_BYPASS = "true", ALLOWED_EMAILS = "dev@xray.local" }

[[env.development.d1_databases]]
binding = "DB"
database_name = "xray-db"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[env.production]
name = "xray"
vars = { ENVIRONMENT = "production" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "xray-db"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

# S3.10 — Rate Limiting binding (configure real namespace id before prod ingest)
# [[unsafe.bindings]]
# name = "XRAY_INGEST_RL"
# type = "ratelimit"
# namespace_id = "0"
# simple = { limit = 60, period = 60 }
